name: Android Release (Play Store)

# Builds a signed App Bundle (.aab, what Google Play accepts) and a signed APK
# for sideload testing. Run manually: Actions -> Android Release -> Run workflow.
#
# Signing key: add repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. If they are absent the first run generates a NEW
# upload key and attaches it as the "upload-keystore" artifact - save it as secrets, then
# delete that artifact. Losing the upload key means a support request to Google to reset it.

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Production backend URL (must be https), e.g. https://api.example.com/api/v1/"
        required: true
      version_code:
        description: "Play versionCode (integer, must increase on every upload)"
        required: true
        default: "1"
      version_name:
        description: "Version shown to users"
        required: true
        default: "1.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android/mobileapp
    env:
      API_URL: ${{ inputs.api_base_url }}
    steps:
      - name: Require https backend URL
        run: |
          case "$API_URL" in
            https://*) ;;
            *) echo "api_base_url must start with https:// for a Play Store build"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          KS="$RUNNER_TEMP/ks/upload.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
          else
            echo "::warning::No signing secrets configured - generating a one-time upload key (see upload-keystore artifact)."
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS=tallysync-upload
            keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=TallySync, O=TallySync, C=AE"
            mkdir -p "$RUNNER_TEMP/ks-out"
            cp "$KS" "$RUNNER_TEMP/ks-out/upload.jks"
            printf 'ANDROID_KEY_ALIAS=%s\nANDROID_KEYSTORE_PASSWORD=%s\nANDROID_KEY_PASSWORD=%s\nANDROID_KEYSTORE_BASE64=(base64 -w0 upload.jks)\n' \
              "$KEY_ALIAS" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" > "$RUNNER_TEMP/ks-out/SECRETS.txt"
            echo "GENERATED_KEY=1" >> "$GITHUB_ENV"
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          {
            echo "TALLYSYNC_KEYSTORE_FILE=$KS"
            echo "TALLYSYNC_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "TALLYSYNC_KEY_ALIAS=$KEY_ALIAS"
            echo "TALLYSYNC_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Build signed AAB + APK
        run: >
          ./gradlew bundleRelease assembleRelease --stacktrace
          -PapiBaseUrl="$API_URL"
          -PversionCode="${{ inputs.version_code }}"
          -PversionName="${{ inputs.version_name }}"

      - name: Verify signing
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -5
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | head -2

      - uses: actions/upload-artifact@v4
        with:
          name: tallysync-release-aab
          path: android/mobileapp/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: tallysync-release-apk
          path: android/mobileapp/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: env.GENERATED_KEY == '1'
        with:
          name: upload-keystore
          path: ${{ runner.temp }}/ks-out/
          retention-days: 3
