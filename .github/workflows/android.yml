name: Android

on:
  push:
    branches: [master, "claude/**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL baked into the APK (phone-reachable), e.g. http://192.168.1.20:3000/api/v1/"
        required: false
        default: "http://10.0.2.2:3000/api/v1/"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android/mobileapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (validation + API contract)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace -PapiBaseUrl="${{ inputs.api_base_url || 'http://10.0.2.2:3000/api/v1/' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: tallysync-debug-apk
          path: android/mobileapp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: android/mobileapp/app/build/reports/tests/
