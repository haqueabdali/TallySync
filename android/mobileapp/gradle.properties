# The JDK comes from gradle/gradle-daemon-jvm.properties (auto-provisioned on every OS).
# Do not pin org.gradle.java.home here: a machine-specific path breaks every other machine and CI.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
kotlin.code.style=official