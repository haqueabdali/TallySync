services:
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    init: true
    environment:
      DATA_SOURCE_NAME: >-
        postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: ${POSTGRES_EXPORTER_MEMORY_LIMIT:-128m}
    cpus: ${POSTGRES_EXPORTER_CPU_LIMIT:-0.25}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILES:-5}
    networks:
      - tallysync_internal

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped
    init: true
    command:
      - --nginx.scrape-uri=http://nginx:8080/nginx_status
    depends_on:
      nginx:
        condition: service_healthy
    mem_limit: ${NGINX_EXPORTER_MEMORY_LIMIT:-96m}
    cpus: ${NGINX_EXPORTER_CPU_LIMIT:-0.25}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILES:-5}
    networks:
      - tallysync_internal

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    init: true
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./infra/observability/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    mem_limit: ${BLACKBOX_MEMORY_LIMIT:-96m}
    cpus: ${BLACKBOX_CPU_LIMIT:-0.25}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILES:-5}
    networks:
      - tallysync_internal

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    init: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - tallysync_prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - postgres-exporter
      - nginx-exporter
      - blackbox-exporter
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-512m}
    cpus: ${PROMETHEUS_CPU_LIMIT:-0.5}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILES:-5}
    networks:
      - tallysync_internal

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    init: true
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_PORT: 3000
    volumes:
      - tallysync_grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    depends_on:
      - prometheus
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-384m}
    cpus: ${GRAFANA_CPU_LIMIT:-0.5}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILES:-5}
    networks:
      - tallysync_internal

volumes:
  tallysync_prometheus_data:
  tallysync_grafana_data:
