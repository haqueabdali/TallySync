worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format tallysync_json escape=json
    '{"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"request_id":"$http_x_request_id"}';

  access_log /var/log/nginx/access.log tallysync_json;
  error_log  /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  keepalive_timeout 30s;
  keepalive_requests 1000;

  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  client_max_body_size 2m;

  upstream tallysync_api {
    least_conn;
    zone tallysync_api 64k;

    server api-a:3000 max_fails=2 fail_timeout=5s;
    server api-b:3000 max_fails=2 fail_timeout=5s;

    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 30s;
  }

  server {
    listen 8080;
    server_name _;

    location = /lb-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok\n';
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $http_x_request_id;

      proxy_connect_timeout 2s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;

      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 5s;

      proxy_pass http://tallysync_api;

      # Verification only: may contain a retry chain; the final address served the response.
      add_header X-TallySync-Upstream $upstream_addr always;
    }
  }
}
